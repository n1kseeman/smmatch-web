<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — SMMATCH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
  <div class="topbar-wrap"><header class="container topbar"><a href="../../index.html" class="brand">SM<span>MATCH</span></a></header></div>
  <main class="container auth-wrap">
    <section class="card auth-card">
      <h1>Создать аккаунт</h1>
      <div class="field">
        <label>Роль</label>
        <input type="hidden" name="account_role" value="business">
        <div class="role-switch">
          <button type="button" class="btn btn-ghost role-btn active-role" data-role-btn="business" aria-pressed="true">Бизнес</button>
          <button type="button" class="btn btn-ghost role-btn" data-role-btn="specialist" aria-pressed="false">Специалист</button>
        </div>
      </div>
      <div class="field"><label>Имя</label><input placeholder="Ваше имя"></div>
      <div class="field"><label>Email</label><input type="email" placeholder="you@company.com"></div>
      <div class="field"><label>Пароль</label><input type="password" placeholder="••••••••"></div>
      <button class="btn btn-primary">Зарегистрироваться</button>
      <div class="chips"><a class="chip" href="../login/index.html">Уже есть аккаунт? Войти</a></div>
    </section>
  </main>
  <script src="../../js/app.js"></script>
</body>
</html>
