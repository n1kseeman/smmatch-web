<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отзывы бизнеса — SMMATCH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body>
  <div class="topbar-wrap"><header class="container topbar"><a href="../../../index.html" class="brand">SM<span>MATCH</span></a></header></div>
  <main class="container section dash">
    <aside class="card dash-menu">
      <a href="../index.html">Главная</a>
      <a href="../messages/index.html">Сообщения</a>
      <a href="../tasks/index.html">Задачи</a>
      <a href="../favorites/index.html">Избранное</a>
      <a href="../payments/index.html">Платежи</a>
      <a class="active" href="../reviews/index.html">Отзывы</a>
    </aside>
    <section class="dash-panels">
      <article class="card">
        <h2>Ваши отзывы специалистам</h2>
        <div class="panel-list">
          <div class="panel-item"><div class="meta">Оставляйте отзыв после завершения сделки, чтобы влиять на рейтинг специалистов.</div></div>
        </div>
      </article>
      <article class="card">
        <h2>Оставить новый отзыв</h2>
        <div class="field"><label>Специалист</label><select><option>Выберите специалиста</option></select></div>
        <div class="field"><label>Оценка</label><select><option>5</option><option>4</option><option>3</option></select></div>
        <div class="field"><label>Комментарий</label><textarea placeholder="Опишите результат и опыт работы"></textarea></div>
        <button class="btn btn-primary">Сохранить отзыв</button>
      </article>
    </section>
  </main>
  <script src="../../../js/app.js"></script>
</body>
</html>
