<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Content Generator — SMMATCH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">

</head>
<body>
  <div class="topbar-wrap"><header class="container topbar"><a href="../../index.html" class="brand">SM<span>MATCH</span></a><nav class="nav"><a href="../../ai/match/index.html">AI Match</a><a href="../../ai/instagram-audit/index.html">Instagram Audit</a><a class="active" href="../../ai/content-generator/index.html">Content AI</a></nav></header></div>
  <main class="container section roi-grid">
    <article class="card">
      <h1>AI Генератор контента</h1>
      <p class="meta">Соберите идеи Reels, постов и stories под нишу, площадку, цель и тон бренда.</p>
      <div class="field"><label>Ниша</label><select><option>Кафе</option><option>Салоны</option><option>Цветы</option></select></div>
      <div class="field"><label>Платформа</label><select><option>Instagram Reels</option><option>TikTok</option><option>Telegram</option></select></div>
      <div class="field"><label>Цель</label><select><option>Охваты</option><option>Лиды</option><option>Продажи</option></select></div>
      <div class="field"><label>Тон общения</label><select><option>Экспертный</option><option>Дружелюбный</option><option>Дерзкий</option></select></div>
      <div class="field"><label>Количество идей</label><input type="number" min="1" max="10" value="5"></div>
      <button class="btn btn-primary">Сгенерировать</button>
    </article>
    <article class="card">
      <h2>Сгенерированные идеи</h2>
      <div class="panel-list">
        <div class="panel-item"><strong>Готово к генерации</strong><div class="meta">Выберите нишу, платформу и цель, чтобы собрать идеи с hook, структурой и CTA.</div></div>
      </div>
    </article>
  </main>
  <script src="../../js/app.js?v=20260717-5"></script>
